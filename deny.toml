[advisories]
version = 2
yanked = "deny"
# Normal builds must contain no affected RSA implementation. The independently
# resolved offline migration executable has its own narrowly scoped policy.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Incompatible upstream API generations cannot be unified by a lockfile update.
# Pin each older version explicitly; new duplicates still fail and stale skips warn.
skip = [
  { crate = "base64@0.22.1", reason = "Required by age 0.12.1, age-core 0.12.0." },
  { crate = "block-buffer@0.10.4", reason = "Required by digest 0.10.7." },
  { crate = "cpufeatures@0.2.17", reason = "Required by aes 0.8.4, chacha20 0.9.1; other legacy crypto consumers share this API." },
  { crate = "crypto-common@0.1.7", reason = "Required by aead 0.5.2, cipher 0.4.4; other legacy crypto consumers share this API." },
  { crate = "curve25519-dalek@4.1.3", reason = "Required by age 0.12.1, ed25519-dalek 2.2.0; other legacy crypto consumers share this API." },
  { crate = "digest@0.10.7", reason = "Required by curve25519-dalek 4.1.3, hmac 0.12.1; other legacy crypto consumers share this API." },
  { crate = "ed25519@2.2.3", reason = "Required by ed25519-dalek 2.2.0." },
  { crate = "ed25519-dalek@2.2.0", reason = "Required by ssh-key 0.6.7." },
  { crate = "fiat-crypto@0.2.9", reason = "Required by curve25519-dalek 4.1.3." },
  { crate = "getrandom@0.2.17", reason = "Required by rand_core 0.6.4." },
  { crate = "rand_core@0.6.4", reason = "Required by crypto-common 0.1.7, curve25519-dalek 4.1.3; other legacy crypto consumers share this API." },
  { crate = "sha2@0.10.9", reason = "Required by age 0.12.1, age-core 0.12.0; other legacy crypto consumers share this API." },
  { crate = "signature@2.2.0", reason = "Required by ed25519 2.2.3." },
  { crate = "syn@2.0.119", reason = "Required by curve25519-dalek-derive 0.1.1, defmt-macros 1.1.1; other legacy crypto consumers share this API." },
  { crate = "thiserror@1.0.69", reason = "Required by i18n-config 0.4.8, i18n-embed 0.16.0." },
  { crate = "thiserror-impl@1.0.69", reason = "Required by thiserror 1.0.69." },
  { crate = "toml@0.5.11", reason = "Required by find-crate 0.6.3." },
  { crate = "x25519-dalek@2.0.1", reason = "Required by age 0.12.1." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kellpossible/cargo-i18n"]
