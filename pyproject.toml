[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [".github/tests"]
python_files = ["test_*.py"]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
xfail_strict = true

[tool.ruff]
fix = false
preview = true
target-version = "py314"

[tool.ruff.lint]
preview = true
future-annotations = true
select = ["ALL"]
ignore = [
  # Ruff formatter owns these rules.
  "tab-indentation",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "docstring-tab-indentation",
  "triple-single-quotes",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "multi-line-implicit-string-concatenation",
  "line-too-long",
  "CPY",
  "FBT",
  "implicit-namespace-package",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  # ty checks every helper and dynamically injected NixOS driver script. Type
  # inference is more useful here than annotations on fixture callbacks.
  "missing-type-function-argument",
  "missing-type-args",
  "missing-type-kwargs",
  "missing-return-type-undocumented-public-function",
  "missing-return-type-private-function",
  "missing-return-type-special-method",
  # These are internal CI/test helpers rather than a public Python API.
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-init",
  # One-shot CI commands use direct exception messages as operator diagnostics.
  "raw-string-in-exception",
  "f-string-in-exception",
  "raise-vanilla-args",
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]

"nix/tests/scripts/check_darwin_boot.py" = [
  # Execute generated launchd arguments with a disposable blocking adapter.
  "assert",
  "print",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]

"nix/tests/scripts/check_runtime_mountpoint.py" = [
  # Generated activation is exercised with a disposable mount command fixture.
  # The interpreter token becomes an immutable absolute store path before use.
  "assert",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "uncapitalized-environment-variables",
]

"nix/tests/scripts/*_test.py" = [
  # NixOS VM tests use ordinary Python assertions as their failure signal.
  "assert",
]

".github/tests/**/*.py" = [
  # Retained unittest suites exercise fixed local commands and temporary Git
  # trees; subprocess calls use argument lists without a shell.
  "assert",
  "pytest-unittest-assertion",
  "pytest-unittest-raises-assertion",
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
".github/scripts/ci_rust.py" = [
  # CI orchestration invokes fixed cargo/nix commands and prints job output.
  "docstring-missing-returns",
  "docstring-missing-exception",
  "print",
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
"nix/tests/scripts/bootstrap_tty.py" = [
  # The integration fixture intentionally asserts invariants, replaces its
  # process with the tested CLI, and reports one final result to the Nix driver.
  "assert",
  "print",
  "start-process-with-no-shell",
  "subprocess-run-without-check",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true

[tool.ty.analysis]
# Driver dependencies are Linux-only; native Linux checks use its real types.
allowed-unresolved-imports = ["test_driver.*"]

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"

[tool.ty.src]
include = ["**/*.py", "**/*.pyi"]
exclude = [
  ".git",
  ".direnv",
  ".ruff_cache",
  ".pytest_cache",
  "**/__pycache__",
  "result",
]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
