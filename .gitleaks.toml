title = "nix-seal Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
description = "The activation integration test uses a deterministic, non-secret password canary."
paths = ['''^crates/nix-seal-cli/src/main\.rs$''']
regexes = ['''password=Y2xpLWFjdGl2YXRpb24tY2FuYXJ5''']
