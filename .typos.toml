files.extend-exclude = [
  "flake.lock",
  "flake/dev/flake.lock",
  "Cargo.lock",
  "fuzz/Cargo.lock",
  "legacy/Cargo.lock",
  ".git/**",
  "target/**",
  "vendor/age/**",
]

[default.extend-words]
ANDed = "ANDed"
WRONLY = "WRONLY"
intoto = "intoto"

[default.extend-identifiers]
ANDed = "ANDed"

[type.gitleaks]
extend-glob = [".gitleaks.toml"]
# Reviewed public cryptographic fixture strings are data, not spelling.
extend-ignore-re = ['''age1[0-9a-z]{58,}''', '''[A-Za-z0-9/+\\]{48,}''']
