[[audits.zeroize]]
who = "Codex review for nix-forge"
criteria = "safe-to-deploy"
delta = "1.9.0 -> 1.9.1"
notes = "Reviewed published crate archives against Cargo.lock checksums. Zeroizing Debug becomes opaque rather than exposing its wrapped value. Generic Vec<T> wiping now calls T::zeroize on initialized elements and wipes spare capacity before clear, rather than raw-wiping every former element representation. The consumed byte buffers remain cleared; this does not guarantee complete erasure of arbitrary element representations or prior reallocations. Existing volatile writes and allocation bounds remain. Internal optimization_barrier calls are removed; the public fallback reads MaybeUninit<u8> to avoid treating potentially uninitialized bytes as initialized u8. SIMD paths retain volatile writes. Allocator tests identify the actual registered pointer. Dependencies, features, build behavior, MSRV, and licensing are unchanged; no I/O capability is added. This is a source-delta deployment review, not an independent cryptographic audit."
