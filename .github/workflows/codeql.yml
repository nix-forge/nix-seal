name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze-language:
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    permissions:
      actions: read # Read workflow metadata for Actions analysis.
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@a53126de1b983ccdb5ab7b1ab9989ef921a880d5 # v2.5.3
    with:
      languages: ${{ matrix.language }}
  analyze:
    name: analyze
    needs: [analyze-language]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CodeQL language to pass
        env:
          ANALYSIS_RESULT: ${{ needs.analyze-language.result }}
        run: test "$ANALYSIS_RESULT" = success
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [analyze-language, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@a53126de1b983ccdb5ab7b1ab9989ef921a880d5 # v2.5.3
