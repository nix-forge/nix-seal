name: Assurance
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"
permissions: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  miri:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Run Miri on the memory-safe core
        # The checked-in rust-toolchain.toml pins stable. Select nightly on
        # the command itself so Rustup cannot override this job's toolchain.
        run: cargo +nightly miri test -p nix-seal-core --lib
  address-sanitizer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Both the sanitizer flags and -Zbuild-std require nightly.
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rust-src
      - name: Run address sanitizer on the parser core
        # The explicit toolchain bypasses the stable repository pin.
        run: cargo +nightly test -p nix-seal-core --lib -Zbuild-std --target x86_64-unknown-linux-gnu
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.0
      - name: Install cargo-mutants
        run: cargo install --locked --version 27.1.0 cargo-mutants
      - name: Mutate policy and core crates
        run: |
          set +e
          cargo mutants \
            --package nix-seal-core \
            --package nix-seal-policy \
            --timeout 120 \
            --in-place
          status=$?
          set -e

          # Exit 2 means the campaign completed and found surviving mutants.
          # Report that known coverage debt without hiding baseline failures,
          # timeouts, configuration errors, or internal errors.
          if [[ "$status" -eq 2 ]]; then
            echo "::warning title=Mutation coverage debt::Surviving mutants were found; inspect the uploaded mutants-out artifact."
            exit 0
          fi
          exit "$status"
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-seal-mutants-${{ github.sha }}
          path: mutants.out
          if-no-files-found: warn
