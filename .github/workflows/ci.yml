name: CI
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  legacy-symbols:
    name: legacy-symbols
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject removed manager symbols and runtime references
        run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  rust:
    name: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    # Preserve required check names while retiring the macos-14 runner image.
    runs-on: ${{ matrix.os == 'macos-14' && 'macos-26' || matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Rust toolchain
        run: python3 .github/scripts/ci-rust.py toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select manifest MSRV
        run: python3 .github/scripts/ci-rust.py msrv
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  nix:
    name: nix
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin
    # Preserve required check names while retiring the macos-14 runner image.
    runs-on: ${{ matrix.os == 'macos-14' && 'macos-26' || matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
        with:
          cache: 'false'
          cache-scope: ci-nix
      - name: Build every declared native check
        uses: nix-forge/ci/actions/flake-checks@6ddb6f568f93b25a199c1d988c64ba2c2e9a3161 # v2.4.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
      - name: Build portable lint checks once
        if: matrix.system == 'x86_64-linux'
        uses: nix-forge/ci/actions/flake-checks@6ddb6f568f93b25a199c1d988c64ba2c2e9a3161 # v2.4.0
        with:
          system: ${{ matrix.system }}
          checks-output: lintChecks
      - name: Validate flake output schemas
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: nix flake check --no-build --show-trace --system "$TARGET_SYSTEM"
  tooling:
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
        with:
          cache: 'false'
          cache-scope: ci-tooling
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
      - name: Test Rust build source boundaries
        run: python3 -m unittest discover -s .github/tests
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
        with:
          history-baseline: .gitleaks-baseline.json
  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Rust toolchain
        run: python3 .github/scripts/ci-rust.py toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-vet
        run: cargo install --locked --version 0.10.2 cargo-vet
      - run: cargo vet --locked
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Rust toolchain
        run: python3 .github/scripts/ci-rust.py toolchain
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
        with:
          cache: 'false'
          cache-scope: ci-audit
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      # RustCrypto RSA is retained only for the documented OpenSSH migration
      # compatibility path; see ADR 0009 for the compensating controls and
      # explicit pre-1.0 release-blocker status.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Scan all supported lockfiles
        run: nix develop --command osv-scanner scan source --recursive --config osv-scanner.toml .
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The repository's stable rust-toolchain file otherwise overrides the
      # nightly selected below when cargo-fuzz starts rustc with -Z flags.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup override set nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Fuzz every registered target
        run: python3 .github/scripts/ci-rust.py fuzz
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Rust toolchain
        run: python3 .github/scripts/ci-rust.py toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record runner metadata
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "kernel=$(uname -a)"
            echo "rust=$(rustc --version --verbose)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
          } > benchmark-environment.txt
      - name: Run scale benchmark
        run: cargo bench -p nix-seal-policy --bench scale --locked > benchmark.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-seal-benchmarks-${{ github.sha }}
          path: |
            benchmark.jsonl
            benchmark-environment.txt
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [legacy-symbols, rust, msrv, nix, tooling, vet, audit, fuzz-smoke, benchmarks, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@d84cb92725a2ab7eafcdc9d1f1fb7a06048dfa1a # v2.2.0
