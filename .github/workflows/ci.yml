name: Seal dependency reconciliation
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: seal-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    name: Lockfile and trusted-import reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared repository toolchain
        run: python3 .github/scripts/ci_rust.py toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Resolve legacy and fuzz lockfiles against exact shared pins
        run: |
          mkdir receipt
          git rev-parse HEAD > receipt/source.txt
          cargo update --manifest-path legacy/Cargo.toml --package jiff --precise 0.2.39
          cargo update --manifest-path fuzz/Cargo.toml --package jiff --precise 0.2.39
          cp Cargo.lock receipt/root-Cargo.lock
          cp legacy/Cargo.lock receipt/legacy-Cargo.lock
          cp fuzz/Cargo.lock receipt/fuzz-Cargo.lock
      - name: Install the policy's pinned cargo-vet
        run: cargo install --locked --version 0.10.2 cargo-vet
      - name: Refresh trusted audits without advancing exemptions
        run: |
          before=$(sha256sum supply-chain/config.toml)
          set +e
          cargo vet --no-minimize-exemptions > receipt/vet-root.log 2>&1
          root_status=$?
          cargo vet --manifest-path legacy/Cargo.toml --store-path supply-chain --locked \
            > receipt/vet-legacy.log 2>&1
          legacy_status=$?
          set -e
          test "$before" = "$(sha256sum supply-chain/config.toml)"
          cp supply-chain/imports.lock receipt/imports.lock
          printf 'root=%s\nlegacy=%s\n' "$root_status" "$legacy_status" > receipt/vet-status.txt
          cat receipt/vet-root.log receipt/vet-legacy.log
          test "$root_status" = 0 && test "$legacy_status" = 0
      - name: Record generated patch
        if: always()
        run: |
          mkdir -p receipt
          git diff --binary > receipt/reconciliation.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: seal-dependency-reconciliation
          path: receipt
