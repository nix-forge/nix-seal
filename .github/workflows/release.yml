name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions: {}
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  build:
    name: build
    timeout-minutes: 90
    env:
      TARGET_SYSTEM: ${{ matrix.system }}
      ARTIFACT_NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            system: x86_64-linux
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            system: aarch64-linux
          - name: aarch64-darwin
            runner: macos-26
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET_SYSTEM: ${{ matrix.system }}
      ARTIFACT_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@a53126de1b983ccdb5ab7b1ab9989ef921a880d5 # v2.5.3
        with:
          cache: 'false'
          cache-scope: release-build
      - name: Build the reproducible Nix package
        run: nix build --print-build-logs ".#packages.${TARGET_SYSTEM}.nix-seal"
      - name: Stage executable
        run: |
          mkdir -p dist
          cp result/bin/nix-seal "dist/nix-seal-${RELEASE_TAG}-${ARTIFACT_NAME}"
          chmod 0755 "dist/nix-seal-${RELEASE_TAG}-${ARTIFACT_NAME}"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: result
          format: cyclonedx-json
          output-file: "dist/nix-seal-${{ github.ref_name }}-${{ matrix.name }}.cdx.json"
      - name: Record checksums and build metadata
        run: |
          (cd dist && sha256sum -- * > "nix-seal-${RELEASE_TAG}-${ARTIFACT_NAME}.sha256")
          {
            echo "commit=${GITHUB_SHA}"
            echo "tag=${RELEASE_TAG}"
            echo "system=${TARGET_SYSTEM}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "rust-toolchain=$(test -f rust-toolchain.toml && sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml || true)"
          } > "dist/nix-seal-${RELEASE_TAG}-${ARTIFACT_NAME}.build-info"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-seal-release-${{ matrix.name }}
          path: dist
          if-no-files-found: error
          retention-days: 7
  publish:
    name: publish
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Update trusted repository automation.
      id-token: write # Authenticate the configured publication service.
      attestations: write # Publish release provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/${TAG}.md"
          test -s "$notes"
          grep -q '^## Changelog$' "$notes"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nix-seal-release-*
          path: dist
          merge-multiple: true
      - name: Verify release inputs
        run: |
          set -euo pipefail
          test -n "${GITHUB_REF_NAME}"
          test -n "$(find dist -type f -name 'nix-seal-*' -not -name '*.cdx.json' -not -name '*.sha256' -not -name '*.build-info' | head -n1)"
          (cd dist && for checksum in *.sha256; do sha256sum -c "$checksum"; done)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nix-seal-*
      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          --title "nix-seal ${GITHUB_REF_NAME}"
