name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  SLSA_BUILDER_SHA: bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01
jobs:
  build:
    name: build and attest ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            system: x86_64-linux
          - name: aarch64-linux
            system: aarch64-linux
          - name: aarch64-darwin
            system: aarch64-darwin
    uses: nix-forge/ci/.github/workflows/slsa-nix-seal-release.yml@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0-compatible SLSA builder
    with:
      system: ${{ matrix.system }}
    permissions:
      contents: read # Read the tagged source for the release build.
      id-token: write # Request a short-lived Sigstore signing identity.
      attestations: write # Publish provenance to GitHub's attestation store.
  publish:
    name: publish
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read # Download the immutable builder outputs.
      contents: write # Publish the verified tagged release.
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/$TAG.md"
          test -s "$notes"
          grep -q '^## Changelog$' "$notes"
      - name: Download the builder outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nix-seal-slsa-release-*
          path: dist
          merge-multiple: true
      - name: Verify release bytes
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            base="nix-seal-${GITHUB_REF_NAME}-${system}"
            for suffix in '' '.cdx.json' '.build-info' '.sha256'; do
              test -s "dist/$base$suffix"
            done
            (
              cd dist
              sha256sum -c "$base.sha256"
            )
            info="dist/$base.build-info"
            grep -Fx "repository=$GITHUB_REPOSITORY" "$info"
            grep -Fx "source_ref=$GITHUB_REF" "$info"
            grep -Fx "source_commit=$GITHUB_SHA" "$info"
            grep -Fx "tag=$GITHUB_REF_NAME" "$info"
            grep -Fx "system=$system" "$info"
            grep -Fx "builder_workflow=nix-forge/ci/.github/workflows/slsa-nix-seal-release.yml" "$info"
          done
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SLSA_BUILDER_SHA: ${{ env.SLSA_BUILDER_SHA }}
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            base="dist/nix-seal-${GITHUB_REF_NAME}-${system}"
            bundle="$base.intoto.jsonl"
            test -s "$bundle"
            for suffix in '' '.cdx.json' '.build-info' '.sha256'; do
              gh attestation verify "$base$suffix" \
                --repo "$GITHUB_REPOSITORY" \
                --bundle "$bundle" \
                --signer-workflow nix-forge/ci/.github/workflows/slsa-nix-seal-release.yml \
                --signer-digest "$SLSA_BUILDER_SHA" \
                --source-ref "$GITHUB_REF"
            done
          done
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --draft --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          --title "nix-seal ${GITHUB_REF_NAME}" && gh release edit "${GITHUB_REF_NAME}" --draft=false
