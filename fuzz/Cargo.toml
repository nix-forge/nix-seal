[package]
name = "nix-seal-fuzz"
version = "0.0.0"
publish = false
license = "MIT OR Apache-2.0"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
nix-seal-core = { path = "../crates/nix-seal-core", version = "=0.1.0-alpha.1" }
nix-seal-cache = { path = "../crates/nix-seal-cache", version = "=0.1.0-alpha.1" }
nix-seal-crypto = { path = "../crates/nix-seal-crypto", version = "=0.1.0-alpha.1" }
nix-seal-manifest = { path = "../crates/nix-seal-manifest", version = "=0.1.0-alpha.1" }
nix-seal-policy = { path = "../crates/nix-seal-policy", version = "=0.1.0-alpha.1" }
nix-seal-runtime = { path = "../crates/nix-seal-runtime", version = "=0.1.0-alpha.1" }
secrecy = "0.10"
serde_json = "1.0"
tempfile = "3"

[[bin]]
name = "plan-v2"
path = "fuzz_targets/plan_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache-state-v1"
path = "fuzz_targets/cache_state_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity-v1"
path = "fuzz_targets/identity_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifact-envelope-v1"
path = "fuzz_targets/artifact_envelope_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "activation-v2"
path = "fuzz_targets/activation_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template-v1"
path = "fuzz_targets/template_v1.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# This workspace does not inherit patches from the parent Cargo manifest.
[patch.crates-io]
age = { path = "../vendor/age" }
i18n-config = { git = "https://github.com/kellpossible/cargo-i18n", rev = "2ce7b1dfe9a8cc224288bf50cbc2a67a6de863c4" }
